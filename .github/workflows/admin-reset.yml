name: Emergency Reset Xiaowen Admin

on:
  workflow_dispatch:

concurrency:
  group: xiaowen-ai-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate reset secret
        env:
          ADMIN_RESET_PASSWORD: ${{ secrets.ADMIN_RESET_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_RESET_PASSWORD"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Reset superadmin password with rollback backup
        env:
          ADMIN_RESET_PASSWORD: ${{ secrets.ADMIN_RESET_PASSWORD }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail
          admin_hash=$(node <<'NODE'
          const { randomBytes, scrypt } = require('node:crypto');
          const password = process.env.ADMIN_RESET_PASSWORD;
          if (!password || password.length < 12) process.exit(2);
          const salt = randomBytes(16).toString('hex');
          scrypt(password, salt, 64, (error, derived) => {
            if (error) throw error;
            process.stdout.write(`scrypt$${salt}$${derived.toString('hex')}`);
          });
          NODE
          )
          admin_hash_b64=$(printf '%s' "$admin_hash" | base64 -w0)
          ssh -p "$SERVER_PORT" -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" \
            "ADMIN_HASH_B64='$admin_hash_b64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/apps/xiaowen-ai/current
          backup_dir=/opt/apps/xiaowen-ai/backups
          backup_file="$backup_dir/superadmin-password-hash-before-$(date -u +%Y%m%dT%H%M%SZ).txt"
          install -m 700 -d "$backup_dir"
          docker compose -p xiaowen-ai exec -T postgres \
            psql -U postgres -d xiaowen_ai -Atc \
            "SELECT password_hash FROM platform_admin WHERE username='superadmin'" \
            > "$backup_file"
          test -s "$backup_file"
          chmod 600 "$backup_file"
          ADMIN_HASH=$(printf '%s' "$ADMIN_HASH_B64" | base64 -d)
          export ADMIN_HASH
          result=$(docker compose -p xiaowen-ai exec -T postgres \
            psql -U postgres -d xiaowen_ai -v ON_ERROR_STOP=1 -qAtc \
            "UPDATE platform_admin SET password_hash='${ADMIN_HASH}', failed_attempts=0, locked_until=NULL, must_change_password=false, status='active', updated_at=NOW() WHERE username='superadmin' RETURNING username")
          test "$result" = "superadmin"
          unset ADMIN_HASH ADMIN_HASH_B64
          echo "superadmin reset complete; rollback backup retained at $backup_file"
          REMOTE

      - name: Verify reset credentials
        env:
          ADMIN_RESET_PASSWORD: ${{ secrets.ADMIN_RESET_PASSWORD }}
        run: |
          set -euo pipefail
          node <<'NODE'
          (async () => {
            const response = await fetch('https://xiaowen.cytopia.cn/api/admin/auth/login', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                username: 'superadmin',
                password: process.env.ADMIN_RESET_PASSWORD,
              }),
            });
            if (!response.ok) throw new Error(`admin login verification failed: HTTP ${response.status}`);
            const payload = await response.json();
            if (payload?.admin?.username !== 'superadmin' || !payload?.token) {
              throw new Error('admin login verification returned an invalid payload');
            }
            console.log('superadmin login verified');
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
