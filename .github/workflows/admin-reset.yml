name: Emergency Reset Xiaowen Admin

on:
  workflow_dispatch:

concurrency:
  group: xiaowen-ai-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate reset secret
        env:
          ADMIN_RESET_PASSWORD: ${{ secrets.ADMIN_RESET_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_RESET_PASSWORD"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Reset superadmin password with rollback backup
        env:
          ADMIN_RESET_PASSWORD: ${{ secrets.ADMIN_RESET_PASSWORD }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail
          admin_password_b64=$(printf '%s' "$ADMIN_RESET_PASSWORD" | base64 -w0)
          ssh -p "$SERVER_PORT" -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" \
            "ADMIN_PASSWORD_B64='$admin_password_b64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/apps/xiaowen-ai/current
          backup_dir=/opt/apps/xiaowen-ai/backups
          backup_file="$backup_dir/superadmin-password-hash-before-$(date -u +%Y%m%dT%H%M%SZ).txt"
          install -m 700 -d "$backup_dir"
          docker compose -p xiaowen-ai exec -T postgres \
            sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc \
            "SELECT password_hash FROM platform_admin WHERE username='"'"'superadmin'"'"'"' \
            > "$backup_file"
          test -s "$backup_file"
          chmod 600 "$backup_file"
          export ADMIN_PASSWORD_B64
          docker compose -p xiaowen-ai exec -T \
            -e ADMIN_PASSWORD_B64="$ADMIN_PASSWORD_B64" backend node - <<'NODE'
          const { Client } = require('pg');
          const {
            hashAdminPassword,
            verifyAdminPassword,
          } = require('./dist/src/admin/admin-password.js');

          (async () => {
            const password = Buffer.from(process.env.ADMIN_PASSWORD_B64, 'base64').toString('utf8');
            const passwordHash = await hashAdminPassword(password);
            const client = new Client({
              host: process.env.DB_HOST || 'postgres',
              port: Number(process.env.DB_PORT || 5432),
              database: process.env.DB_NAME || 'xiaowen_ai',
              user: process.env.DB_USER || 'postgres',
              password: process.env.DB_PASSWORD || 'postgres',
            });
            await client.connect();
            try {
              const result = await client.query(
                `UPDATE platform_admin
                 SET password_hash = $1,
                     failed_attempts = 0,
                     locked_until = NULL,
                     must_change_password = false,
                     status = 'active',
                     updated_at = NOW()
                 WHERE username = $2
                 RETURNING username, password_hash`,
                [passwordHash, 'superadmin'],
              );
              if (result.rowCount !== 1 || result.rows[0].username !== 'superadmin') {
                throw new Error('superadmin row was not updated');
              }
              if (!await verifyAdminPassword(password, result.rows[0].password_hash)) {
                throw new Error('stored password hash failed in-container verification');
              }
              console.log('superadmin password reset and hash verified inside backend container');
            } finally {
              await client.end();
            }
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          NODE
          docker compose -p xiaowen-ai exec -T \
            -e ADMIN_PASSWORD_B64="$ADMIN_PASSWORD_B64" backend node - <<'NODE'
          (async () => {
            const password = Buffer.from(process.env.ADMIN_PASSWORD_B64, 'base64').toString('utf8');
            const response = await fetch('http://127.0.0.1:3000/api/admin/auth/login', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ username: 'superadmin', password }),
            });
            if (!response.ok) {
              throw new Error(`in-container login failed: HTTP ${response.status} ${await response.text()}`);
            }
            const payload = await response.json();
            if (payload?.admin?.username !== 'superadmin' || !payload?.token) {
              throw new Error('in-container login returned an invalid payload');
            }
            console.log('superadmin login verified against the production backend container');

            const api = async (path, init = {}) => {
              const headers = new Headers(init.headers || {});
              headers.set('authorization', `Bearer ${payload.token}`);
              if (init.body) headers.set('content-type', 'application/json');
              const apiResponse = await fetch(`http://127.0.0.1:3000${path}`, { ...init, headers });
              const apiPayload = await apiResponse.json().catch(() => ({}));
              if (!apiResponse.ok) {
                throw new Error(`${init.method || 'GET'} ${path} failed: HTTP ${apiResponse.status} ${JSON.stringify(apiPayload)}`);
              }
              return apiPayload;
            };

            const enterprises = await api('/api/admin/enterprises?page=1&pageSize=100');
            const active = (enterprises.items || []).filter((item) => item.status === 'active');
            const preferred = active.filter((item) => /天禹|销问|熵舟/.test(item.name));
            const targets = preferred.length ? preferred : active.length === 1 ? active : [];
            if (!targets.length) {
              throw new Error(`unable to select the target enterprise safely; active count=${active.length}`);
            }

            const boostingTableId = '7a204022-7d22-4986-8c2a-b290841bf830';
            const desiredHotwords = [
              { word: '天禹', weight: 10, aliases: [] },
              { word: '天禹数智', weight: 10, aliases: [] },
            ];
            for (const enterprise of targets) {
              const enterpriseId = encodeURIComponent(enterprise.id);
              await api(`/api/admin/asr-hotwords/config?enterpriseId=${enterpriseId}`, {
                method: 'PUT',
                body: JSON.stringify({ boostingTableId }),
              });
              const current = await api(`/api/admin/asr-hotwords?enterpriseId=${enterpriseId}`);
              for (const desired of desiredHotwords) {
                const existing = (current.items || []).find((item) => item.word === desired.word);
                await api(existing
                  ? `/api/admin/asr-hotwords/${encodeURIComponent(existing.id)}?enterpriseId=${enterpriseId}`
                  : `/api/admin/asr-hotwords?enterpriseId=${enterpriseId}`, {
                  method: existing ? 'PUT' : 'POST',
                  body: JSON.stringify(desired),
                });
              }
              const verified = await api(`/api/admin/asr-hotwords?enterpriseId=${enterpriseId}`);
              const verifiedWords = new Map((verified.items || []).map((item) => [item.word, item]));
              if (verified.boostingTableId !== boostingTableId
                || desiredHotwords.some((item) => verifiedWords.get(item.word)?.weight !== 10)) {
                throw new Error(`hotword verification failed for enterprise ${enterprise.name}`);
              }
              console.log(`ASR hotwords verified for enterprise: ${enterprise.name}`);
            }
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          NODE
          login_json=$(printf '%s' "$ADMIN_PASSWORD_B64" | base64 -d \
            | jq -Rs '{username:"superadmin", password:.}')
          direct_status=$(curl -sS -o /tmp/xiaowen-admin-direct.json -w '%{http_code}' \
            -X POST http://127.0.0.1:8100/api/admin/auth/login \
            -H 'content-type: application/json' --data-binary "$login_json")
          test "$direct_status" = "200" || {
            echo "host-port login failed: HTTP $direct_status"
            cat /tmp/xiaowen-admin-direct.json
            exit 1
          }
          nginx_status=$(curl --noproxy '*' --resolve xiaowen.cytopia.cn:443:127.0.0.1 \
            -sS -o /tmp/xiaowen-admin-nginx.json -w '%{http_code}' \
            -X POST https://xiaowen.cytopia.cn/api/admin/auth/login \
            -H 'content-type: application/json' --data-binary "$login_json")
          test "$nginx_status" = "200" || {
            echo "outer-nginx login failed: HTTP $nginx_status"
            cat /tmp/xiaowen-admin-nginx.json
            exit 1
          }
          rm -f /tmp/xiaowen-admin-direct.json /tmp/xiaowen-admin-nginx.json
          unset login_json
          echo "superadmin login verified through host port and outer nginx"
          unset ADMIN_PASSWORD_B64
          echo "superadmin reset complete; rollback backup retained at $backup_file"
          REMOTE

      - name: Verify public service health
        run: |
          set -euo pipefail
          node <<'NODE'
          (async () => {
            const response = await fetch('https://xiaowen.cytopia.cn/api/health');
            if (!response.ok) throw new Error(`public health verification failed: HTTP ${response.status}`);
            const payload = await response.json();
            if (payload?.status !== 'ok' || payload?.database !== 'ok') {
              throw new Error('public health verification returned an invalid payload');
            }
            console.log('public service health verified');
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
