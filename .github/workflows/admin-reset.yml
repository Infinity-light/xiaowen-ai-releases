name: Emergency Reset Xiaowen Admin

on:
  workflow_dispatch:

concurrency:
  group: xiaowen-ai-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate reset secret
        env:
          ADMIN_RESET_PASSWORD: ${{ secrets.ADMIN_RESET_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_RESET_PASSWORD"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Reset superadmin password with rollback backup
        env:
          ADMIN_RESET_PASSWORD: ${{ secrets.ADMIN_RESET_PASSWORD }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail
          admin_password_b64=$(printf '%s' "$ADMIN_RESET_PASSWORD" | base64 -w0)
          ssh -p "$SERVER_PORT" -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" \
            "ADMIN_PASSWORD_B64='$admin_password_b64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/apps/xiaowen-ai/current
          backup_dir=/opt/apps/xiaowen-ai/backups
          backup_file="$backup_dir/superadmin-password-hash-before-$(date -u +%Y%m%dT%H%M%SZ).txt"
          install -m 700 -d "$backup_dir"
          docker compose -p xiaowen-ai exec -T postgres \
            sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc \
            "SELECT password_hash FROM platform_admin WHERE username='"'"'superadmin'"'"'"' \
            > "$backup_file"
          test -s "$backup_file"
          chmod 600 "$backup_file"
          export ADMIN_PASSWORD_B64
          docker compose -p xiaowen-ai exec -T \
            -e ADMIN_PASSWORD_B64="$ADMIN_PASSWORD_B64" backend node - <<'NODE'
          const { Client } = require('pg');
          const {
            hashAdminPassword,
            verifyAdminPassword,
          } = require('./dist/src/admin/admin-password.js');

          (async () => {
            const password = Buffer.from(process.env.ADMIN_PASSWORD_B64, 'base64').toString('utf8');
            const passwordHash = await hashAdminPassword(password);
            const client = new Client({
              host: process.env.DB_HOST || 'postgres',
              port: Number(process.env.DB_PORT || 5432),
              database: process.env.DB_NAME || 'xiaowen_ai',
              user: process.env.DB_USER || 'postgres',
              password: process.env.DB_PASSWORD || 'postgres',
            });
            await client.connect();
            try {
              const result = await client.query(
                `UPDATE platform_admin
                 SET password_hash = $1,
                     failed_attempts = 0,
                     locked_until = NULL,
                     must_change_password = false,
                     status = 'active',
                     updated_at = NOW()
                 WHERE username = $2
                 RETURNING username, password_hash`,
                [passwordHash, 'superadmin'],
              );
              if (result.rowCount !== 1 || result.rows[0].username !== 'superadmin') {
                throw new Error('superadmin row was not updated');
              }
              if (!await verifyAdminPassword(password, result.rows[0].password_hash)) {
                throw new Error('stored password hash failed in-container verification');
              }
              console.log('superadmin password reset and hash verified inside backend container');
            } finally {
              await client.end();
            }
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          NODE
          docker compose -p xiaowen-ai exec -T \
            -e ADMIN_PASSWORD_B64="$ADMIN_PASSWORD_B64" backend node - <<'NODE'
          (async () => {
            const password = Buffer.from(process.env.ADMIN_PASSWORD_B64, 'base64').toString('utf8');
            const response = await fetch('http://127.0.0.1:3000/api/admin/auth/login', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ username: 'superadmin', password }),
            });
            if (!response.ok) {
              throw new Error(`in-container login failed: HTTP ${response.status} ${await response.text()}`);
            }
            const payload = await response.json();
            if (payload?.admin?.username !== 'superadmin' || !payload?.token) {
              throw new Error('in-container login returned an invalid payload');
            }
            console.log('superadmin login verified against the production backend container');
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          NODE
          unset ADMIN_PASSWORD_B64
          echo "superadmin reset complete; rollback backup retained at $backup_file"
          REMOTE

      - name: Verify reset credentials
        env:
          ADMIN_RESET_PASSWORD: ${{ secrets.ADMIN_RESET_PASSWORD }}
        run: |
          set -euo pipefail
          node <<'NODE'
          (async () => {
            const response = await fetch('https://xiaowen.cytopia.cn/api/admin/auth/login', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                username: 'superadmin',
                password: process.env.ADMIN_RESET_PASSWORD,
              }),
            });
            if (!response.ok) throw new Error(`admin login verification failed: HTTP ${response.status}`);
            const payload = await response.json();
            if (payload?.admin?.username !== 'superadmin' || !payload?.token) {
              throw new Error('admin login verification returned an invalid payload');
            }
            console.log('superadmin login verified');
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
