name: Deploy Xiaowen AI
run-name: "deploy ${{ github.event.client_payload.source_sha || github.event.client_payload.ref || inputs.ref }} [${{ github.event.client_payload.dispatch_id || 'manual' }}]"


on:
  repository_dispatch:
    types: [deploy, release]
  workflow_dispatch:
    inputs:
      ref:
        description: Source commit SHA
        required: true
      repo:
        description: Source repository
        required: true
        default: Infinity-light/xiaowen-ai

concurrency:
  group: xiaowen-ai-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Resolve source
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "ref=${{ github.event.client_payload.ref }}" >> "$GITHUB_OUTPUT"
            echo "repo=${{ github.event.client_payload.repo }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
            echo "repo=${{ inputs.repo }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repo }}
          ref: ${{ steps.source.outputs.ref }}
          token: ${{ secrets.GH_RELEASE_REPO_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            admin-web/package-lock.json

      - name: Verify production dependencies and builds
        shell: bash
        run: |
          set -euo pipefail
          for package in backend frontend admin-web; do
            (cd "$package" && npm ci && npm audit --omit=dev --audit-level=moderate --registry=https://registry.npmjs.org)
          done
          (cd backend && npm run build && npm test)
          (cd frontend && npm run type-check && npm run test:routing && npm run build:mp-weixin)
          (cd admin-web && npm run typecheck && npm run build)
          cp .env.example .env
          DB_PASSWORD=ci-placeholder NEO4J_PASSWORD=ci-placeholder docker compose config --quiet
          rm -f .env

      - name: Reclaim scoped deployment workspace
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -p "$SERVER_PORT" -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
            "$SERVER_USER@$SERVER_HOST" \
            'rm -f /tmp/xiaowen-ai-*.tgz /tmp/xiaowen-images-*.tgz /tmp/xiaowen-oss-*.env'

      - name: Build release images
        env:
          SOURCE_SHA: ${{ steps.source.outputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          tar --exclude=.git --exclude=.workflow --exclude=node_modules --exclude=dist --exclude=.env \
            -czf /tmp/xiaowen-ai.tgz .
          docker build \
            -t "xiaowen-ai-backend:${SOURCE_SHA}" \
            -t xiaowen-ai-backend:latest \
            backend
          docker tag "xiaowen-ai-backend:${SOURCE_SHA}" "xiaowen-ai-seed:${SOURCE_SHA}"
          docker tag "xiaowen-ai-backend:${SOURCE_SHA}" xiaowen-ai-seed:latest
          docker build \
            -t "xiaowen-ai-frontend:${SOURCE_SHA}" \
            -t xiaowen-ai-frontend:latest \
            frontend
          docker build \
            -t "xiaowen-ai-admin-web:${SOURCE_SHA}" \
            -t xiaowen-ai-admin-web:latest \
            admin-web
          docker pull redis:7.4-alpine
          docker pull neo4j:5.26.12-community
          docker save \
            xiaowen-ai-backend:latest \
            "xiaowen-ai-backend:${SOURCE_SHA}" \
            xiaowen-ai-seed:latest \
            "xiaowen-ai-seed:${SOURCE_SHA}" \
            xiaowen-ai-frontend:latest \
            "xiaowen-ai-frontend:${SOURCE_SHA}" \
            xiaowen-ai-admin-web:latest \
            "xiaowen-ai-admin-web:${SOURCE_SHA}" \
            redis:7.4-alpine \
            neo4j:5.26.12-community | gzip -1 > /tmp/xiaowen-images.tgz

      - name: Upload and deploy
        env:
          SOURCE_SHA: ${{ steps.source.outputs.ref }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          XIAOWEN_OSS_ACCESS_KEY_ID: ${{ secrets.XIAOWEN_OSS_ACCESS_KEY_ID }}
          XIAOWEN_OSS_ACCESS_KEY_SECRET: ${{ secrets.XIAOWEN_OSS_ACCESS_KEY_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_SHA"
          test -n "$XIAOWEN_OSS_ACCESS_KEY_ID"
          test -n "$XIAOWEN_OSS_ACCESS_KEY_SECRET"
          test -n "$DEEPSEEK_API_KEY"
          test -n "$SILICONFLOW_API_KEY"
          test -n "$ARK_API_KEY"
          test -n "$REDIS_PASSWORD"
          test -n "$NEO4J_PASSWORD"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          oss_env="/tmp/xiaowen-oss-${SOURCE_SHA}.env"
          {
            printf 'XIAOWEN_OSS_ACCESS_KEY_ID=%s\n' "$XIAOWEN_OSS_ACCESS_KEY_ID"
            printf 'XIAOWEN_OSS_ACCESS_KEY_SECRET=%s\n' "$XIAOWEN_OSS_ACCESS_KEY_SECRET"
            printf 'DEEPSEEK_API_KEY=%s\n' "$DEEPSEEK_API_KEY"
            printf 'SILICONFLOW_API_KEY=%s\n' "$SILICONFLOW_API_KEY"
            printf 'OSS_BUCKET=clouddreamai\n'
            printf 'OSS_REGION=oss-cn-shanghai\n'
            printf 'ARK_API_KEY=%s\n' "$ARK_API_KEY"
            printf 'REDIS_PASSWORD=%s\n' "$REDIS_PASSWORD"
            printf 'NEO4J_USER=neo4j\n'
            printf 'NEO4J_PASSWORD=%s\n' "$NEO4J_PASSWORD"
            printf 'NEO4J_DATABASE=neo4j\n'
            printf 'APP_RELEASE=%s\n' "$SOURCE_SHA"
            printf 'GRAPH_INDEX_VERSION=graphrag-v3\n'
            printf 'GRAPH_BOOTSTRAP_ACTIVE_VERSION=graphrag-v1\n'
            printf 'GRAPH_EXTRACTION_PRIMARY_PROVIDER=deepseek\n'
            printf 'GRAPH_EXTRACTION_FALLBACK_PROVIDER=siliconflow\n'
            printf 'GRAPH_EXTRACTION_FALLBACK_BASE_URL=https://api.siliconflow.cn/v1\n'
            printf 'GRAPH_EXTRACTION_FALLBACK_MODEL=deepseek-ai/DeepSeek-V4-Flash\n'
          } > "$oss_env"
          chmod 600 "$oss_env"

          scp -P "$SERVER_PORT" -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
            /tmp/xiaowen-ai.tgz "$SERVER_USER@$SERVER_HOST:/tmp/xiaowen-ai-${SOURCE_SHA}.tgz"
          scp -P "$SERVER_PORT" -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
            /tmp/xiaowen-images.tgz "$SERVER_USER@$SERVER_HOST:/tmp/xiaowen-images-${SOURCE_SHA}.tgz"
          scp -P "$SERVER_PORT" -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
            "$oss_env" "$SERVER_USER@$SERVER_HOST:/tmp/xiaowen-oss-${SOURCE_SHA}.env"

          ssh -p "$SERVER_PORT" -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
            "$SERVER_USER@$SERVER_HOST" "SOURCE_SHA='$SOURCE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          app_root=/opt/apps/xiaowen-ai
          release="$app_root/releases/$SOURCE_SHA"
          previous_release=$(readlink -f "$app_root/current" || true)
          rollback_armed=false
          deployment_committed=false

          rollback_deployment() {
            original_status="$1"
            trap - EXIT
            if [ "$original_status" -eq 0 ] \
              || [ "$rollback_armed" != true ] \
              || [ "$deployment_committed" = true ]; then
              exit "$original_status"
            fi

            set +e
            echo "::error::Candidate release $release failed; rolling back to ${previous_release:-<none>}"
            if [ -f "$release/docker-compose.yml" ]; then
              cd "$release"
              docker compose -p xiaowen-ai logs --tail 120 || true
            fi

            rollback_ok=true
            if [ -z "$previous_release" ] \
              || [ "$previous_release" = "$release" ] \
              || [ ! -f "$previous_release/docker-compose.yml" ]; then
              echo "::error::No valid previous release is available for automatic rollback"
              rollback_ok=false
            fi

            if [ "$rollback_ok" = true ]; then
              rollback_sha=$(basename "$previous_release")
              for service in backend seed frontend admin-web; do
                rollback_image="xiaowen-ai-${service}:${rollback_sha}"
                if ! docker image inspect "$rollback_image" >/dev/null 2>&1; then
                  echo "::error::Missing rollback image $rollback_image"
                  rollback_ok=false
                  continue
                fi
                docker image tag "$rollback_image" "xiaowen-ai-${service}:latest" || rollback_ok=false
              done
            fi

            if [ "$rollback_ok" = true ]; then
              ln -sfn "$previous_release" "$app_root/current" || rollback_ok=false
              cd "$app_root/current" || rollback_ok=false
            fi
            if [ "$rollback_ok" = true ]; then
              timeout 240 docker compose -p xiaowen-ai up -d --no-build --remove-orphans || rollback_ok=false
            fi

            if [ "$rollback_ok" = true ]; then
              rollback_health_ok=false
              for attempt in 1 2 3 4 5; do
                rollback_payload=$(curl -fsS http://127.0.0.1:8100/api/health || true)
                if echo "$rollback_payload" | jq -e \
                  '.status == "ok" and .graph.status == "ok" and .queue.status == "ok"' >/dev/null 2>&1; then
                  rollback_health_ok=true
                  break
                fi
                sleep 5
              done
              if [ "$rollback_health_ok" != true ]; then
                echo "::error::Rollback boot health failed"
                rollback_ok=false
              fi
            fi

            if [ "$rollback_ok" = true ]; then
              sleep 60
              for service in backend frontend admin-web; do
                container_id=$(docker compose -p xiaowen-ai ps -q "$service")
                if [ -z "$container_id" ] \
                  || [ "$(docker inspect "$container_id" --format '{{.State.Running}}')" != true ] \
                  || [ "$(docker inspect "$container_id" --format '{{.RestartCount}}')" != 0 ]; then
                  echo "::error::Rollback $service is not running stably"
                  rollback_ok=false
                fi
              done
              frontend_id=$(docker compose -p xiaowen-ai ps -q frontend)
              if [ -z "$frontend_id" ]; then
                echo "::error::Rollback frontend is not running"
                rollback_ok=false
              fi
              rollback_payload=$(curl -fsS http://127.0.0.1:8100/api/health || true)
              if ! echo "$rollback_payload" | jq -e \
                '.status == "ok" and .graph.status == "ok" and .queue.status == "ok"' >/dev/null 2>&1; then
                echo "::error::Rollback health degraded after stability window: $rollback_payload"
                rollback_ok=false
              fi
            fi

            if [ "$rollback_ok" = true ]; then
              echo "Automatic rollback succeeded: $previous_release"
            else
              echo "::error::Automatic rollback failed; production requires operator recovery"
              if [ -f "$app_root/current/docker-compose.yml" ]; then
                cd "$app_root/current"
                docker compose -p xiaowen-ai ps -a || true
                docker compose -p xiaowen-ai logs --tail 120 || true
              fi
            fi
            exit "$original_status"
          }
          trap 'rollback_deployment "$?"' EXIT

          sudo mkdir -p "$release"
          sudo chown -R "$(id -u):$(id -g)" "$app_root"
          tar -xzf "/tmp/xiaowen-ai-${SOURCE_SHA}.tgz" -C "$release"

          if [ -n "$previous_release" ] \
            && [ "$previous_release" != "$release" ] \
            && [ -f "$previous_release/docker-compose.yml" ]; then
            previous_sha=$(basename "$previous_release")
            [[ "$previous_sha" =~ ^[0-9a-f]{40}$ ]]
            cd "$previous_release"
            for service in backend seed frontend admin-web; do
              container_id=$(docker compose -p xiaowen-ai ps -a -q "$service")
              test -n "$container_id"
              image_id=$(docker inspect "$container_id" --format '{{.Image}}')
              test -n "$image_id"
              docker image tag "$image_id" "xiaowen-ai-${service}:${previous_sha}"
            done
          fi
          gzip -dc "/tmp/xiaowen-images-${SOURCE_SHA}.tgz" | docker load

          if [ -n "$previous_release" ] \
            && [ "$previous_release" != "$release" ] \
            && [ -f "$previous_release/.env" ]; then
            install -m 600 "$previous_release/.env" "$release/.env"
          elif [ -f "$release/.env" ]; then
            chmod 600 "$release/.env"
          else
            install -m 600 "/tmp/xiaowen-oss-${SOURCE_SHA}.env" "$release/.env"
          fi
          sed -i \
            -e '/^XIAOWEN_OSS_ACCESS_KEY_ID=/d' \
            -e '/^XIAOWEN_OSS_ACCESS_KEY_SECRET=/d' \
            -e '/^DEEPSEEK_API_KEY=/d' \
            -e '/^SILICONFLOW_API_KEY=/d' \
            -e '/^OSS_BUCKET=/d' \
            -e '/^OSS_REGION=/d' \
            -e '/^ARK_API_KEY=/d' \
            -e '/^REDIS_PASSWORD=/d' \
            -e '/^NEO4J_USER=/d' \
            -e '/^NEO4J_PASSWORD=/d' \
            -e '/^NEO4J_DATABASE=/d' \
            -e '/^APP_RELEASE=/d' \
            -e '/^GRAPH_INDEX_VERSION=/d' \
            -e '/^GRAPH_BOOTSTRAP_ACTIVE_VERSION=/d' \
            -e '/^GRAPH_EXTRACTION_PRIMARY_PROVIDER=/d' \
            -e '/^GRAPH_EXTRACTION_FALLBACK_PROVIDER=/d' \
            -e '/^GRAPH_EXTRACTION_FALLBACK_BASE_URL=/d' \
            -e '/^GRAPH_EXTRACTION_FALLBACK_MODEL=/d' \
            "$release/.env"
          cat "/tmp/xiaowen-oss-${SOURCE_SHA}.env" >> "$release/.env"

          if [ -n "$previous_release" ] && [ -f "$previous_release/docker-compose.yml" ]; then
            mkdir -p "$app_root/backups"
            cd "$previous_release"
            postgres_id=$(docker compose -p xiaowen-ai ps -q postgres)
            if [ -n "$postgres_id" ]; then
              backup_file="$app_root/backups/pre-${SOURCE_SHA}.sql.gz"
              docker compose -p xiaowen-ai exec -T postgres \
                pg_dump -U postgres xiaowen_ai < /dev/null | gzip -1 > "$backup_file"
              test -s "$backup_file"
            fi
            ln -sfn "$previous_release" "$app_root/previous"
          fi

          rollback_armed=true
          ln -sfn "$release" "$app_root/current"
          cd "$app_root/current"
          docker compose -p xiaowen-ai up -d --no-build --remove-orphans
          seed_id=$(docker compose -p xiaowen-ai ps -a -q seed)
          test -n "$seed_id"
          docker wait "$seed_id"
          test "$(docker inspect "$seed_id" --format '{{.State.ExitCode}}')" = 0

          for attempt in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8100/api/health | grep -q '"status":"ok"'; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              docker compose -p xiaowen-ai logs --tail 100
              exit 1
            fi
            sleep 5
          done

          sleep 60
          for service in postgres redis neo4j backend frontend admin-web; do
            container_id=$(docker compose -p xiaowen-ai ps -q "$service")
            test -n "$container_id"
            test "$(docker inspect "$container_id" --format '{{.RestartCount}}')" = 0
          done
          health_payload=$(curl -fsS http://127.0.0.1:8100/api/health)
          echo "$health_payload" | jq -e \
            '.status == "ok" and .graph.status == "ok" and .queue.status == "ok"' >/dev/null

          deployment_committed=true
          rollback_armed=false
          docker image prune -f || true

          rm -f \
            "/tmp/xiaowen-ai-${SOURCE_SHA}.tgz" \
            "/tmp/xiaowen-images-${SOURCE_SHA}.tgz" \
            "/tmp/xiaowen-oss-${SOURCE_SHA}.env"
          REMOTE

          rm -f "$oss_env"

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          health_payload=$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            https://xiaowen.cytopia.cn/api/health)
          echo "$health_payload" | jq -e \
            '.status == "ok" and .graph.status == "ok" and .queue.status == "ok"' >/dev/null

      - name: Verify deployment stability
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SERVER_PORT" -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
            "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/apps/xiaowen-ai/current
          for service in postgres redis neo4j backend frontend admin-web; do
            container_id=$(docker compose -p xiaowen-ai ps -q "$service")
            test -n "$container_id"
            test "$(docker inspect "$container_id" --format '{{.RestartCount}}')" = 0
          done
          REMOTE

      - name: Smoke production frontend
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 30 \
            https://xiaowen.cytopia.cn/
