name: Verify GraphRAG Replica Generation Lock

run-name: "verify graphrag replica lock ${{ inputs.ref }}"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact production source commit
        required: true

concurrency:
  group: xiaowen-ai-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Run controlled two-replica verification
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          EXPECTED_SHA: ${{ inputs.ref }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SERVER_PORT" -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" \
            "EXPECTED_SHA='$EXPECTED_SHA' RUN_ID='$RUN_ID' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          app_root=/opt/apps/xiaowen-ai
          cd "$app_root/current"
          evidence_dir="$app_root/runtime-evidence"
          evidence_file="$evidence_dir/graphrag-replica-lock-${RUN_ID}.json"
          mkdir -p "$evidence_dir"
          started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          phase=bootstrap
          scale_status=-1
          scale_output='not attempted'
          same_acquired=-1
          same_yielded=-1
          different_acquired=-1
          released=false
          new_critical=-1
          new_deadlocks=-1
          new_replay_failures=-1
          open_critical=-1
          generation_query_status=-1
          generation_row_count=0
          generation_summary='not attempted'
          observed_replica_count=1
          completed_reconciliation_cycles=0
          same_probe_one_exit=-1
          same_probe_two_exit=-1
          same_probe_stderr='not attempted'
          different_probe_one_exit=-1
          different_probe_two_exit=-1
          different_probe_stderr='not attempted'
          release_probe_exit=-1
          release_probe_stderr='not attempted'
          current_sha=$(basename "$(readlink -f "$app_root/current")")

          psql_value() {
            docker compose -p xiaowen-ai exec -T postgres \
              psql -U postgres -d xiaowen_ai -Atc "$1" < /dev/null
          }

          cleanup() {
            original_status=$1
            trap - EXIT ERR
            set +e
            cd "$app_root/current"
            phase_at_exit=$phase
            before_cleanup=$(for container_id in $(docker compose -p xiaowen-ai ps -a -q backend); do
              docker inspect "$container_id" --format '{{.Name}}|{{.State.Status}}|{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}|restart={{.RestartCount}}|exit={{.State.ExitCode}}'
            done)
            backend_error_line_count=$(docker compose -p xiaowen-ai logs --no-color --tail 120 backend 2>&1 \
              | grep -Eic 'error|critical|deadlock|forseti' || true)
            cleanup_output=$(docker compose -p xiaowen-ai up -d --no-build --no-recreate --no-deps --scale backend=1 backend 2>&1)
            cleanup_status=$?
            for attempt in $(seq 1 18); do
              remaining=$(docker compose -p xiaowen-ai ps -q backend | wc -l | tr -d ' ')
              health=$(curl -fsS http://127.0.0.1:8100/api/health 2>/dev/null || true)
              if [ "$remaining" = 1 ] && echo "$health" | jq -e \
                '.status == "ok" and .graph.status == "ok" and .queue.counts.failed == 0' >/dev/null 2>&1; then
                break
              fi
              sleep 5
            done
            remaining=$(docker compose -p xiaowen-ai ps -q backend | wc -l | tr -d ' ')
            after_cleanup=$(for container_id in $(docker compose -p xiaowen-ai ps -a -q backend); do
              docker inspect "$container_id" --format '{{.Name}}|{{.State.Status}}|{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}|restart={{.RestartCount}}|exit={{.State.ExitCode}}'
            done)
            if [ "$cleanup_status" != 0 ] || [ "$remaining" != 1 ]; then
              echo "::error::Failed to restore the single-replica baseline"
              original_status=1
            fi
            finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            result=failure
            if [ "$original_status" = 0 ] && [ "$phase_at_exit" = completed ]; then
              result=success
            elif [ "$original_status" = 0 ]; then
              original_status=45
            fi
            jq -n \
              --arg result "$result" \
              --arg release "$current_sha" \
              --arg startedAt "$started_at" \
              --arg finishedAt "$finished_at" \
              --arg phaseAtExit "$phase_at_exit" \
              --argjson originalExitCode "$original_status" \
              --argjson scaleExitCode "$scale_status" \
              --arg scaleOutput "$scale_output" \
              --argjson generationQueryExitCode "$generation_query_status" \
              --argjson generationQueryRowCount "$generation_row_count" \
              --arg generationQuerySummary "$generation_summary" \
              --arg containersBeforeCleanup "$before_cleanup" \
              --argjson backendErrorLineCount "$backend_error_line_count" \
              --arg cleanupOutput "$cleanup_output" \
              --argjson cleanupExitCode "$cleanup_status" \
              --arg containersAfterCleanup "$after_cleanup" \
              --argjson finalReplicaCount "$remaining" \
              --argjson replicaCount "$observed_replica_count" \
              --argjson reconciliationCycles "$completed_reconciliation_cycles" \
              --argjson sameGenerationAcquired "$same_acquired" \
              --argjson sameGenerationYielded "$same_yielded" \
              --argjson sameProbeOneExit "$same_probe_one_exit" \
              --argjson sameProbeTwoExit "$same_probe_two_exit" \
              --arg sameProbeStderr "$same_probe_stderr" \
              --argjson differentGenerationAcquired "$different_acquired" \
              --argjson differentProbeOneExit "$different_probe_one_exit" \
              --argjson differentProbeTwoExit "$different_probe_two_exit" \
              --arg differentProbeStderr "$different_probe_stderr" \
              --arg released "$released" \
              --argjson releaseProbeExit "$release_probe_exit" \
              --arg releaseProbeStderr "$release_probe_stderr" \
              --argjson newCritical "$new_critical" \
              --argjson newDeadlocks "$new_deadlocks" \
              --argjson newReplayFailures "$new_replay_failures" \
              --argjson openCritical "$open_critical" \
              '{result:$result,release:$release,startedAt:$startedAt,finishedAt:$finishedAt,phaseAtExit:$phaseAtExit,originalExitCode:$originalExitCode,generationQuery:{exitCode:$generationQueryExitCode,rowCount:$generationQueryRowCount,summary:$generationQuerySummary},scale:{exitCode:$scaleExitCode,output:$scaleOutput},diagnostics:{containersBeforeCleanup:$containersBeforeCleanup,backendErrorLineCount:$backendErrorLineCount,cleanupOutput:$cleanupOutput,cleanupExitCode:$cleanupExitCode,containersAfterCleanup:$containersAfterCleanup,finalReplicaCount:$finalReplicaCount},replicaCount:$replicaCount,reconciliationCycles:$reconciliationCycles,sameGeneration:{acquired:$sameGenerationAcquired,yielded:$sameGenerationYielded,probeOneExit:$sameProbeOneExit,probeTwoExit:$sameProbeTwoExit,stderr:$sameProbeStderr},differentGenerations:{acquired:$differentGenerationAcquired,probeOneExit:$differentProbeOneExit,probeTwoExit:$differentProbeTwoExit,stderr:$differentProbeStderr},lockReleased:($released == "true"),releaseProbe:{exitCode:$releaseProbeExit,stderr:$releaseProbeStderr},events:{newCritical:$newCritical,newDeadlocks:$newDeadlocks,newReplayFailures:$newReplayFailures,openCritical:$openCritical}}' \
              > "$evidence_file"
            sha256sum "$evidence_file"
            cat "$evidence_file"
            exit "$original_status"
          }
          trap 'cleanup "$?"' EXIT

          phase=verify_release_identity
          test "$current_sha" = "$EXPECTED_SHA"
          phase=select_verified_generations
          before_event_id=$(psql_value "SELECT coalesce(max(id),0) FROM graph_reconcile_event;")
          set +e
          generation_rows=$(psql_value "SELECT enterprise_id || '|' || generation_key FROM graph_generation WHERE graph_version='graphrag-v3' AND status='verified' AND checksum_version=2 ORDER BY expected_entity_count + expected_relation_count DESC, generation_key LIMIT 2;")
          generation_query_status=$?
          set -e
          generation_row_count=$(printf '%s\n' "$generation_rows" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')
          generation_summary=$(printf '%s\n' "$generation_rows" \
            | awk -F'|' 'NF >= 2 { printf "%sgeneration=%s...", separator, substr($2, 1, 12); separator="," }')
          if [ "$generation_query_status" != 0 ]; then
            echo "::error::Verified generation query failed"
            exit 46
          fi
          generation_one=$(printf '%s\n' "$generation_rows" | sed -n '1p')
          generation_two=$(printf '%s\n' "$generation_rows" | sed -n '2p')
          if [ -z "$generation_one" ] || [ -z "$generation_two" ]; then
            echo "::error::Two verified checksum-v2 generations are required"
            exit 41
          fi
          enterprise_one=${generation_one%%|*}
          key_one=${generation_one#*|}
          enterprise_two=${generation_two%%|*}
          key_two=${generation_two#*|}
          identity_one="graph-generation-mutation:${enterprise_one}:${key_one}"
          identity_two="graph-generation-mutation:${enterprise_two}:${key_two}"

          phase=scale_to_two
          set +e
          scale_output=$(docker compose -p xiaowen-ai up -d --no-build --no-recreate --no-deps --scale backend=2 backend 2>&1)
          scale_status=$?
          set -e
          if [ "$scale_status" != 0 ]; then
            echo "::error::Scale-to-two command failed"
            exit 42
          fi
          phase=wait_two_healthy
          for attempt in $(seq 1 24); do
            mapfile -t backend_ids < <(docker compose -p xiaowen-ai ps -q backend)
            healthy=0
            for container_id in "${backend_ids[@]}"; do
              if [ "$(docker inspect "$container_id" --format '{{.State.Health.Status}}')" = healthy ]; then
                healthy=$((healthy + 1))
              fi
            done
            if [ "${#backend_ids[@]}" = 2 ] && [ "$healthy" = 2 ]; then
              break
            fi
            sleep 5
          done
          mapfile -t backend_ids < <(docker compose -p xiaowen-ai ps -q backend)
          if [ "${#backend_ids[@]}" != 2 ]; then
            echo "::error::Expected two backend containers, found ${#backend_ids[@]}"
            exit 43
          fi
          for container_id in "${backend_ids[@]}"; do
            if [ "$(docker inspect "$container_id" --format '{{.State.Health.Status}}')" != healthy ]; then
              echo "::error::Backend replica did not become healthy"
              exit 44
            fi
          done
          observed_replica_count=2

          phase=same_generation_lock_probe
          cat > /tmp/graphrag-lock-probe.js <<'NODE'
          const { Client } = require('/app/node_modules/pg');
          (async () => {
            const identity = process.argv[2];
            const holdMs = Number(process.argv[3] || 0);
            const client = new Client({
              host: process.env.DB_HOST,
              port: Number(process.env.DB_PORT || 5432),
              user: process.env.DB_USER || 'postgres',
              password: process.env.DB_PASSWORD,
              database: process.env.DB_NAME || 'xiaowen_ai',
            });
            let acquired = false;
            await client.connect();
            try {
              const result = await client.query(
                'SELECT pg_try_advisory_lock(hashtextextended($1, 0)) AS acquired',
                [identity],
              );
              acquired = result.rows[0]?.acquired === true;
              if (acquired && holdMs > 0) {
                await new Promise((resolve) => setTimeout(resolve, holdMs));
              }
              process.stdout.write(JSON.stringify({ acquired }));
            } finally {
              if (acquired) {
                await client.query(
                  'SELECT pg_advisory_unlock(hashtextextended($1, 0)) AS released',
                  [identity],
                );
              }
              await client.end();
            }
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          NODE
          for container_id in "${backend_ids[@]}"; do
            docker cp /tmp/graphrag-lock-probe.js "$container_id:/tmp/graphrag-lock-probe.js"
          done

          docker exec "${backend_ids[0]}" node /tmp/graphrag-lock-probe.js "$identity_one" 5000 > /tmp/same-one.json 2> /tmp/same-one.err &
          same_one_pid=$!
          docker exec "${backend_ids[1]}" node /tmp/graphrag-lock-probe.js "$identity_one" 5000 > /tmp/same-two.json 2> /tmp/same-two.err &
          same_two_pid=$!
          set +e
          wait "$same_one_pid"
          same_probe_one_exit=$?
          wait "$same_two_pid"
          same_probe_two_exit=$?
          set -e
          same_probe_stderr=$(cat /tmp/same-one.err /tmp/same-two.err \
            | sed -E 's/[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}/[redacted-uuid]/g; s/[0-9a-fA-F]{40,}/[redacted-hash]/g; s/sk-[A-Za-z0-9_-]+/[redacted-key]/g' \
            | tail -c 2000)
          if [ "$same_probe_one_exit" != 0 ] || [ "$same_probe_two_exit" != 0 ]; then
            echo "::error::Same-generation lock probe process failed"
            exit 47
          fi
          same_acquired=$(jq -s '[.[].acquired] | map(select(. == true)) | length' /tmp/same-one.json /tmp/same-two.json)
          same_yielded=$(jq -s '[.[].acquired] | map(select(. == false)) | length' /tmp/same-one.json /tmp/same-two.json)
          test "$same_acquired" = 1
          test "$same_yielded" = 1

          phase=different_generation_lock_probe
          docker exec "${backend_ids[0]}" node /tmp/graphrag-lock-probe.js "$identity_one" 5000 > /tmp/different-one.json 2> /tmp/different-one.err &
          different_one_pid=$!
          docker exec "${backend_ids[1]}" node /tmp/graphrag-lock-probe.js "$identity_two" 5000 > /tmp/different-two.json 2> /tmp/different-two.err &
          different_two_pid=$!
          set +e
          wait "$different_one_pid"
          different_probe_one_exit=$?
          wait "$different_two_pid"
          different_probe_two_exit=$?
          set -e
          different_probe_stderr=$(cat /tmp/different-one.err /tmp/different-two.err \
            | sed -E 's/[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}/[redacted-uuid]/g; s/[0-9a-fA-F]{40,}/[redacted-hash]/g; s/sk-[A-Za-z0-9_-]+/[redacted-key]/g' \
            | tail -c 2000)
          if [ "$different_probe_one_exit" != 0 ] || [ "$different_probe_two_exit" != 0 ]; then
            echo "::error::Different-generation lock probe process failed"
            exit 48
          fi
          different_acquired=$(jq -s '[.[].acquired] | map(select(. == true)) | length' /tmp/different-one.json /tmp/different-two.json)
          test "$different_acquired" = 2

          set +e
          docker exec "${backend_ids[1]}" node /tmp/graphrag-lock-probe.js "$identity_one" 0 \
            > /tmp/release-probe.json 2> /tmp/release-probe.err
          release_probe_exit=$?
          set -e
          release_probe_stderr=$(sed -E 's/[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}/[redacted-uuid]/g; s/[0-9a-fA-F]{40,}/[redacted-hash]/g; s/sk-[A-Za-z0-9_-]+/[redacted-key]/g' \
            /tmp/release-probe.err | tail -c 2000)
          if [ "$release_probe_exit" != 0 ]; then
            echo "::error::Lock release probe process failed"
            exit 49
          fi
          released=$(jq -r '.acquired' /tmp/release-probe.json)
          test "$released" = true

          # Two full reconciliation cycles with both physical replicas online.
          phase=two_reconciliation_cycles
          sleep 135
          completed_reconciliation_cycles=2

          phase=post_cycle_event_gate
          new_critical=$(psql_value "SELECT count(*) FROM graph_reconcile_event WHERE id > ${before_event_id} AND severity='critical';")
          new_deadlocks=$(psql_value "SELECT count(*) FROM graph_reconcile_event WHERE id > ${before_event_id} AND (detail::text ILIKE '%Forseti%' OR detail::text ILIKE '%deadlock%');")
          new_replay_failures=$(psql_value "SELECT count(*) FROM graph_reconcile_event WHERE id > ${before_event_id} AND event_type='generation_ledger_replay_failed';")
          open_critical=$(psql_value "SELECT count(*) FROM graph_reconcile_event WHERE severity='critical' AND repaired=false;")
          test "$new_critical" = 0
          test "$new_deadlocks" = 0
          test "$new_replay_failures" = 0
          test "$open_critical" = 0

          health_payload=$(curl -fsS http://127.0.0.1:8100/api/health)
          echo "$health_payload" | jq -e \
            '.status == "ok" and .graph.status == "ok" and .graphRelease.openCriticalEventCount == 0 and .queue.counts.failed == 0' >/dev/null
          phase=completed
          REMOTE

      - name: Download verification evidence
        if: always()
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          scp -P "$SERVER_PORT" -i ~/.ssh/deploy_key \
            "$SERVER_USER@$SERVER_HOST:/opt/apps/xiaowen-ai/runtime-evidence/graphrag-replica-lock-${GITHUB_RUN_ID}.json" \
            graphrag-replica-lock-evidence.json
          jq -e '
            .result == "success"
            and .phaseAtExit == "completed"
            and .generationQuery.exitCode == 0
            and .generationQuery.rowCount >= 2
            and .replicaCount == 2
            and .reconciliationCycles == 2
            and .sameGeneration.acquired == 1
            and .sameGeneration.yielded == 1
            and .sameGeneration.probeOneExit == 0
            and .sameGeneration.probeTwoExit == 0
            and .differentGenerations.acquired == 2
            and .differentGenerations.probeOneExit == 0
            and .differentGenerations.probeTwoExit == 0
            and .lockReleased == true
            and .releaseProbe.exitCode == 0
            and .events.newCritical == 0
            and .events.newDeadlocks == 0
            and .events.newReplayFailures == 0
            and .events.openCritical == 0
            and .diagnostics.finalReplicaCount == 1
          ' graphrag-replica-lock-evidence.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphrag-replica-lock-${{ github.run_id }}
          path: graphrag-replica-lock-evidence.json
          if-no-files-found: error
          retention-days: 30
