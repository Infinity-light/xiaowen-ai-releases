name: Stage production v3 for final gate rerun
run-name: "graphrag stage verified v3"

on:
  workflow_dispatch:

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Configure production SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Switch to verified rollback and stage v3
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SERVER_PORT" -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
            "$SERVER_USER@$SERVER_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          app_root=/opt/apps/xiaowen-ai
          current_release=$(readlink -f "$app_root/current")
          test "$(basename "$current_release")" = 67933c114f67ba2dc402cf37133c3f6c9aa5cb64
          cd "$current_release"
          backend_id=$(docker compose -p xiaowen-ai ps -q backend)
          postgres_id=$(docker compose -p xiaowen-ai ps -q postgres)
          test -n "$backend_id"
          test -n "$postgres_id"
          test "$(docker inspect "$backend_id" --format '{{.State.Health.Status}}')" = healthy
          enterprise_id=$(docker exec "$postgres_id" psql -U postgres -d xiaowen_ai -Atc \
            "SELECT enterprise_id::text FROM graph_release WHERE graph_version='graphrag-v3' LIMIT 1")
          [[ "$enterprise_id" =~ ^[0-9a-f-]{36}$ ]]
          evidence_dir=/tmp/graphrag-production-stage-v3
          rm -rf "$evidence_dir"
          mkdir -p "$evidence_dir"
          docker exec "$postgres_id" psql -U postgres -d xiaowen_ai -Atc \
            "SELECT jsonb_build_object(
               'enterpriseId','***','productionRelease','67933c114f67ba2dc402cf37133c3f6c9aa5cb64',
               'releases',(SELECT jsonb_agg(jsonb_build_object('graphVersion',graph_version,'status',status,'ready',ready_file_count,'expected',expected_file_count) ORDER BY created_at) FROM graph_release WHERE enterprise_id='$enterprise_id'),
               'generations',(SELECT jsonb_agg(to_jsonb(g) ORDER BY graph_version,status) FROM (SELECT graph_version,status,count(*)::int generation_count,sum(attempt_count)::int attempt_count FROM graph_generation WHERE enterprise_id='$enterprise_id' GROUP BY graph_version,status) g)
             )" > "$evidence_dir/before.json"
          docker exec -i "$postgres_id" psql -v ON_ERROR_STOP=1 -U postgres -d xiaowen_ai \
            > "$evidence_dir/transaction.log" <<SQL
          BEGIN;
          SELECT pg_advisory_xact_lock(hashtext('graph-release:$enterprise_id'));
          DO \$\$
          DECLARE
            source_active int;
            rollback_retired int;
            source_generations int;
            rollback_generations int;
            source_attempts int;
          BEGIN
            SELECT count(*) INTO source_active FROM graph_release
             WHERE enterprise_id='$enterprise_id' AND graph_version='graphrag-v3'
               AND status='active' AND expected_file_count=31 AND ready_file_count=31;
            SELECT count(*) INTO rollback_retired FROM graph_release
             WHERE enterprise_id='$enterprise_id' AND graph_version='graphrag-v3-rollback'
               AND status='retired' AND expected_file_count=31 AND ready_file_count=31;
            SELECT count(*),sum(attempt_count) INTO source_generations,source_attempts FROM graph_generation
             WHERE enterprise_id='$enterprise_id' AND graph_version='graphrag-v3' AND status='active';
            SELECT count(*) INTO rollback_generations FROM graph_generation
             WHERE enterprise_id='$enterprise_id' AND graph_version='graphrag-v3-rollback' AND status='retired';
            IF source_active<>1 OR rollback_retired<>1 OR source_generations<>31
              OR rollback_generations<>31 OR source_attempts<>430 THEN
              RAISE EXCEPTION 'v3 staging precondition failed: release %/%, generations %/% attempts %',
                source_active, rollback_retired, source_generations, rollback_generations, source_attempts;
            END IF;
          END \$\$;
          UPDATE graph_generation SET status='verified', checkpoint='verify', updated_at=now()
           WHERE enterprise_id='$enterprise_id' AND graph_version='graphrag-v3' AND status='active';
          UPDATE graph_release SET status='building', manifest_checksum=NULL, verified_at=NULL,
             activated_at=NULL, failure_reason=NULL, updated_at=now()
           WHERE enterprise_id='$enterprise_id' AND graph_version='graphrag-v3' AND status='active';
          UPDATE graph_generation SET status='active', checkpoint='complete', updated_at=now()
           WHERE enterprise_id='$enterprise_id' AND graph_version='graphrag-v3-rollback' AND status='retired';
          UPDATE graph_release SET status='active', activated_at=now(), failure_reason=NULL, updated_at=now()
           WHERE enterprise_id='$enterprise_id' AND graph_version='graphrag-v3-rollback' AND status='retired';
          UPDATE graph_product_panorama
           SET status=CASE WHEN graph_version='graphrag-v3-rollback' THEN 'active' ELSE 'retired' END, updated_at=now()
           WHERE enterprise_id='$enterprise_id';
          INSERT INTO graph_reconcile_event
            (enterprise_id, graph_version, severity, event_type, detail, repaired)
          VALUES ('$enterprise_id','graphrag-v3','info','operator_v3_gate_rerun_staged',
            jsonb_build_object('productionRelease','67933c114f67ba2dc402cf37133c3f6c9aa5cb64','rollbackVersion','graphrag-v3-rollback'),true);
          COMMIT;
          SQL
          docker exec "$backend_id" node dist/src/graph/prepare-production-rollback-snapshot.js \
            --enterprise-id "$enterprise_id" \
            --source-graph-version graphrag-v3 \
            --rollback-graph-version graphrag-v3-rollback \
            --expected-count 31 > "$evidence_dir/validation.raw.json"
          tail -n 1 "$evidence_dir/validation.raw.json" | jq \
            'walk(if type == "object" and has("enterpriseId") then .enterpriseId = "***" else . end)' \
            > "$evidence_dir/validation.json"
          jq -e '.passed==true and .activeVersion=="graphrag-v3-rollback" and .sourceRelease.status=="ready"' \
            "$evidence_dir/validation.json" >/dev/null
          payload=$(curl --fail --silent --show-error http://127.0.0.1:8100/api/health)
          echo "$payload" | jq -e \
            '.status=="ok" and .graph.status=="ok" and (.graphRelease.activeVersions | any(.graphVersion=="graphrag-v3-rollback"))' \
            >/dev/null
          printf '%s\n' "$payload" > "$evidence_dir/health.json"
          docker exec "$postgres_id" psql -U postgres -d xiaowen_ai -Atc \
            "SELECT jsonb_build_object(
               'releases',(SELECT jsonb_agg(jsonb_build_object('graphVersion',graph_version,'status',status,'ready',ready_file_count,'expected',expected_file_count) ORDER BY created_at) FROM graph_release WHERE enterprise_id='$enterprise_id'),
               'generations',(SELECT jsonb_agg(to_jsonb(g) ORDER BY graph_version,status) FROM (SELECT graph_version,status,count(*)::int generation_count,sum(attempt_count)::int attempt_count FROM graph_generation WHERE enterprise_id='$enterprise_id' GROUP BY graph_version,status) g),
               'openCriticalEvents',(SELECT count(*)::int FROM graph_reconcile_event WHERE severity='critical' AND repaired=false)
             )" > "$evidence_dir/after.json"
          tar -czf /tmp/graphrag-production-stage-v3.tgz -C "$evidence_dir" .
          REMOTE
          scp -P "$SERVER_PORT" -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
            "$SERVER_USER@$SERVER_HOST:/tmp/graphrag-production-stage-v3.tgz" /tmp/graphrag-production-stage-v3.tgz
          mkdir -p evidence
          tar -xzf /tmp/graphrag-production-stage-v3.tgz -C evidence

      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphrag-production-stage-v3-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
